name: Build Mayank Messenger APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/main.yml'
      - 'index.html'
      - 'manifest.json'
      - '192.png'
      - '512.png'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare website
        run: |
          mkdir -p www
          cp index.html manifest.json 192.png 512.png www/

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli
          npm install @capacitor/android

      - name: Configure Capacitor
        run: |
          npx cap init "Mayank Messenger" "com.mayank.messenger" --web-dir www
          npx cap add android

                 - name: Fix Kotlin dependency conflicts
        run: |
          cd android
          echo "allprojects {" >> build.gradle
          echo "    configurations.all {" >> build.gradle
          echo "        resolutionStrategy.eachDependency {" >> build.gradle
          echo "            if (requested.group == 'org.jetbrains.kotlin') {" >> build.gradle
          echo "                useVersion '1.8.22'" >> build.gradle
          echo "            }" >> build.gradle
          echo "        }" >> build.gradle
          echo "    }" >> build.gradle
          echo "}" >> build.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug 

  

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mayank-Messenger-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
