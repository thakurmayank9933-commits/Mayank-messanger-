<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mayank Messenger</title>
<link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b141a;
      color: white;
    }

    .header {
      background: #202c33;
      padding: 18px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .rooms {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #111b21;
      overflow-x: auto;
    }

    .room {
      border: none;
      padding: 12px 16px;
      border-radius: 20px;
      background: #202c33;
      color: white;
      font-size: 15px;
      white-space: nowrap;
    }

    .room.active {
      background: #00a884;
    }

    .chat {
      height: calc(100vh - 185px);
      overflow-y: auto;
      padding: 15px;
    }
.message {
  background: #202c33;
  padding: 10px 14px;
  border-radius: 14px;
  margin-bottom: 10px;
  max-width: 80%;
  width: fit-content;
  word-wrap: break-word;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

.message.mine {
  margin-left: auto;
  background: #005c4b;
}

.message strong {
  color: #53bdeb;
  display: block;
  margin-bottom: 4px;
}  

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #202c33;
      padding: 10px;
      display: flex;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 25px;
      outline: none;
      font-size: 16px;
    }

    #sendButton {
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      background: #00a884;
      color: white;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <div class="header">
    💬 Mayank Messenger
  </div>

  <div class="rooms">
    <button class="room active" data-room="mayank">👤 Mayank</button>
    <button class="room" data-room="army">🪖 Army Buddy</button>
    <button class="room" data-room="family">👨‍👩‍👦 Family</button>
  </div>

  <div id="chat" class="chat">
    <div class="message">
      <strong>Mayank Messenger</strong>
      🟢 Connecting to Firebase...
    </div>
  </div>

  <div class="input-area">
    <input
      id="messageInput"
      type="text"
      placeholder="Type a message..."
      autocomplete="off"
    >
    <button id="sendButton">➤</button>
  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

    import {
      getAuth,
      signInAnonymously
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

    import {
      getDatabase,
      ref,
      push,
      onChildAdded
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";


    const firebaseConfig = {
      apiKey: "AIzaSyBd4MXU2z-bRvKPpEKu1ZjK8h0fdBxo5DI",
      authDomain: "mayank-messanger.firebaseapp.com",
      databaseURL: "https://mayank-messanger-default-rtdb.firebaseio.com",
      projectId: "mayank-messanger",
      storageBucket: "mayank-messanger.firebasestorage.app",
      messagingSenderId: "715953743940",
      appId: "1:715953743940:web:517b21a068c41ef7e4f411",
      measurementId: "G-FLGY5NQPG5"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    const chat = document.getElementById("chat");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");

    let currentRoom = "mayank";
    let unsubscribe = null;


    signInAnonymously(auth)
      .then(() => {
        loadRoom(currentRoom);
      })
      
.catch(error => {
  chat.innerHTML = `
    <div class="message">
      <strong>❌ Firebase login failed:</strong><br>
      ${error.code}<br>
      ${error.message}
    </div>
  `;
  console.error(error);
});

 function loadRoom(room) {
  currentRoom = room;

  chat.innerHTML = "";

  if (unsubscribe) {
    unsubscribe();
    unsubscribe = null;
  }

  const messagesRef = ref(database, "rooms/" + room + "/messages");

  unsubscribe = onChildAdded(
    messagesRef,
    (snapshot) => {
      const message = snapshot.val();
      const div = document.createElement("div");

      div.className =
        message.sender === "Mayank" ? "message mine" : "message";

      div.innerHTML = `
        <strong>${escapeHtml(message.sender || "User")}</strong>
        ${escapeHtml(message.text || "")}
      `;

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    },
    (error) => {
      chat.innerHTML = `
        <div class="message">
          <strong>Database error</strong>
          ${escapeHtml(error.message)}
        </div>
      `;
    }
  );
}   
      function sendMessage() {

      const text = input.value.trim();

      if (text === "") return;

      const messagesRef = ref(
        database,
        "rooms/" + currentRoom + "/messages"
      );

      push(messagesRef, {
        text: text,
        sender: "Mayank",
        time: Date.now()
      });

      input.value = "";
    }


    function getRoomName(room) {

      if (room === "mayank") return "👤 Mayank";
      if (room === "army") return "🪖 Army Buddy";
      if (room === "family") return "👨‍👩‍👦 Family";

      return "Mayank Messenger";
    }


    document.querySelectorAll(".room").forEach(button => {

      button.addEventListener("click", () => {

        document.querySelectorAll(".room")
          .forEach(b => b.classList.remove("active"));

        button.classList.add("active");

        loadRoom(button.dataset.room);
      });

    });


    sendButton.addEventListener("click", sendMessage);


    input.addEventListener("keydown", (event) => {

      if (event.key === "Enter") {
        sendMessage();
      }

    });


    function escapeHtml(text) {

      const div = document.createElement("div");

      div.textContent = text;

      return div.innerHTML;
    }

  </script>

</body>
</html>
