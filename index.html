<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mayank Messenger</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b141a;
      color: white;
    }

    .header {
      background: #202c33;
      padding: 18px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .chat {
      height: calc(100vh - 125px);
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      background: #202c33;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .message strong {
      color: #53bdeb;
      display: block;
      margin-bottom: 4px;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #202c33;
      padding: 10px;
      display: flex;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 25px;
      outline: none;
      font-size: 16px;
    }

    #sendButton {
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      background: #00a884;
      color: white;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <div class="header">
    💬 Mayank Messenger
  </div>

  <div id="chat" class="chat">
    <div class="message">
      <strong>Mayank Messenger</strong>
      Connecting to Firebase...
    </div>
  </div>

  <div class="input-area">
    <input
      id="messageInput"
      type="text"
      placeholder="Type a message..."
      autocomplete="off"
    >
    <button id="sendButton">➤</button>
  </div>

  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

    import {
      getAuth,
      signInAnonymously
    } from
      "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

    import {
      getDatabase,
      ref,
      push,
      onChildAdded
    } from
      "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";


    // 🔥 MAYANK MESSENGER FIREBASE CONFIG

    const firebaseConfig = {
      apiKey: "AIzaSyBd4MXU2z-bRvKPpEKu1ZjK8h0fdBxo5DI",
      authDomain: "mayank-messanger.firebaseapp.com",
      databaseURL: "https://mayank-messanger-default-rtdb.firebaseio.com",
      projectId: "mayank-messanger",
      storageBucket: "mayank-messanger.firebasestorage.app",
      messagingSenderId: "715953743940",
      appId: "1:715953743940:web:517b21a068c41ef7e4f411",
      measurementId: "G-FLGY5NQPG5"
    };


    // Start Firebase

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const database = getDatabase(app);

    const messagesRef = ref(database, "messages");


    const chat = document.getElementById("chat");

    const input = document.getElementById("messageInput");

    const sendButton = document.getElementById("sendButton");


    // Anonymous login

    signInAnonymously(auth)
      .then(() => {

        console.log("Firebase connected!");

        chat.innerHTML = `
          <div class="message">
            <strong>Mayank Messenger</strong>
            🟢 Connected to Firebase
          </div>
        `;

      })
      .catch((error) => {

        console.error(error);

        chat.innerHTML = `
          <div class="message">
            <strong>Error</strong>
            ❌ Firebase login failed
          </div>
        `;

      });


    // Send message

    function sendMessage() {

      const text = input.value.trim();

      if (text === "") return;

      push(messagesRef, {
        text: text,
        sender: "Mayank",
        time: Date.now()
      });

      input.value = "";

    }


    sendButton.addEventListener("click", sendMessage);


    input.addEventListener("keydown", (event) => {

      if (event.key === "Enter") {
        sendMessage();
      }

    });


    // Receive messages in real time

    onChildAdded(messagesRef, (snapshot) => {

      const message = snapshot.val();

      const div = document.createElement("div");

      div.className = "message";

      div.innerHTML = `
        <strong>${message.sender || "User"}</strong>
        ${escapeHtml(message.text || "")}
      `;

      chat.appendChild(div);

      chat.scrollTop = chat.scrollHeight;

    });


    function escapeHtml(text) {

      const div = document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }

  </script>

</body>
</html>
