name: Build Mayank Messenger Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android project
        run: |
          mkdir -p android-project
          echo "Android project setup is required."
          echo "Existing website files preserved."

      - name: Upload project files
        uses: actions/upload-artifact@v4
        with:
          name: mayank-messenger-source
          path: |
            index.html
            manifest.json
            192.png
            512.png
